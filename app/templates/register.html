{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Registrarse</h2>
    <form action="{{ url_for('main.register') }}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="photo">Foto de Perfil (Obligatorio):</label>
            <input type="file" name="photo" id="photo" required accept="image/*">
        </div>
        <div class="form-group">
            <label for="name">Nombre y Apellido Completo:</label>
            <input type="text" name="name" id="name" required>
        </div>
        <div class="form-group">
            <label for="dni">DNI o Carnet de Extranjería:</label>
            <input type="text" name="dni" id="dni" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" name="password" id="password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar Contraseña:</label>
            <input type="password" name="confirm_password" id="confirm_password" required>
        </div>
        <div class="form-group">
            <label for="department">Departamento:</label>
            <select name="department" id="department" required>
                <option value="">Seleccione</option>
                <option value="Amazonas">Amazonas</option>
                <option value="Áncash">Áncash</option>
                <option value="Apurímac">Apurímac</option>
                <option value="Arequipa">Arequipa</option>
                <option value="Ayacucho">Ayacucho</option>
                <option value="Cajamarca">Cajamarca</option>
                <option value="Callao">Callao</option>
                <option value="Cusco">Cusco</option>
                <option value="Huancavelica">Huancavelica</option>
                <option value="Huánuco">Huánuco</option>
                <option value="Ica">Ica</option>
                <option value="Junín">Junín</option>
                <option value="La Libertad">La Libertad</option>
                <option value="Lambayeque">Lambayeque</option>
                <option value="Lima">Lima</option>
                <option value="Loreto">Loreto</option>
                <option value="Madre de Dios">Madre de Dios</option>
                <option value="Moquegua">Moquegua</option>
                <option value="Pasco">Pasco</option>
                <option value="Piura">Piura</option>
                <option value="Puno">Puno</option>
                <option value="San Martín">San Martín</option>
                <option value="Tacna">Tacna</option>
                <option value="Tumbes">Tumbes</option>
                <option value="Ucayali">Ucayali</option>
            </select>
        </div>
        <div class="form-group">
            <label for="city">Ciudad:</label>
            <input type="text" name="city" id="city" required>
        </div>
        <button type="submit" class="btn">Registrarse</button>
    </form>
</div>
{% endblock %}
