{% extends "base.html" %}

{% block content %}
<div class="publish-container">
    <h2>Publicar Objeto</h2>
    <p>Costo de publicación: 20 coins</p>
    <p>Tus coins actuales: {{ current_user.coins }}</p>

    {% if current_user.coins < 20 %} <div class="alert alert-danger">No tienes suficientes coins para publicar.
</div>
{% else %}
<form action="{{ url_for('main.publish_object') }}" method="post" enctype="multipart/form-data">
    <div class="form-group">
        <label for="photos">Fotos (Mínimo 1):</label>
        <input type="file" name="photos" id="photos" required multiple accept="image/*">
    </div>
    <div class="form-group">
        <label for="title">Título:</label>
        <input type="text" name="title" id="title" required>
    </div>
    <div class="form-group">
        <label for="description">Descripción:</label>
        <textarea name="description" id="description" required></textarea>
    </div>
    <div class="form-group">
        <label for="category">Categoría:</label>
        <select name="category" id="category" required>
            <option value="">Seleccione</option>
            <option value="Ropa">Ropa</option>
            <option value="Electro">Electro</option>
            <option value="Decoración">Decoración</option>
            <option value="Libros">Libros</option>
            <option value="Juguetes">Juguetes</option>
            <option value="Otro">Otro</option>
        </select>
    </div>
    <div class="form-group">
        <label for="condition">Estado:</label>
        <select name="condition" id="condition" required>
            <option value="">Seleccione</option>
            <option value="Nuevo">Nuevo</option>
            <option value="Semi-nuevo">Semi-nuevo</option>
            <option value="Usado">Usado</option>
        </select>
    </div>
    <button type="submit" class="btn-primary">Publicar</button>
</form>
{% endif %}
</div>
{% endblock %}
