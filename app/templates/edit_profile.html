{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <h2>Editar Perfil</h2>
    <form action="{{ url_for('main.edit_profile') }}" method="post">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" value="{{ current_user.email }}" required>
        </div>
        <div class="form-group">
            <label for="bio">Descripción:</label>
            <textarea name="bio" id="bio">{{ current_user.bio }}</textarea>
        </div>
        <div class="form-group">
            <label for="department">Departamento:</label>
            <select name="department" id="department" required>
                <option value="{{ current_user.department }}" selected>{{ current_user.department }}</option>
                <option value="Amazonas">Amazonas</option>
                <option value="Áncash">Áncash</option>
                <!-- Add others if needed, or rely on user not changing it often -->
            </select>
        </div>
        <div class="form-group">
            <label for="city">Ciudad:</label>
            <input type="text" name="city" id="city" value="{{ current_user.city }}" required>
        </div>

        <h3>Cambiar Contraseña (Opcional)</h3>
        <div class="form-group">
            <label for="password">Nueva Contraseña:</label>
            <input type="password" name="password" id="password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirmar Nueva Contraseña:</label>
            <input type="password" name="confirm_password" id="confirm_password">
        </div>

        <button type="submit" class="btn">Guardar Cambios</button>
        <a href="{{ url_for('main.profile') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
